# Gitleaks Configuration
title = "Money Management Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for build artifacts, lockfiles, and secret-scanner unit test fixtures"
paths = [
  '''dist/.*''',
  '''coverage/.*''',
  '''\.lighthouseci/.*''',
  '''lighthouse-reports/.*''',
  '''zap-reports/.*''',
  '''package-lock\.json''',
  '''node_modules/.*''',
  '''scripts/check-secrets\.spec\.js''',
]
regexes = [
  '''YOUR_API_KEY''',
  '''YOUR_PROJECT_ID''',
  '''YOUR_APP_ID''',
  '''YOUR_RECAPTCHA_V3_SITE_KEY''',
]
