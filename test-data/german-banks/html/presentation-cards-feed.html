<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>App Banking – Kartenfeed Ansicht</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; margin: 2rem auto; max-width: 700px; color: #111827; }
    .card-account { background: #1e3a8a; color: #fff; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .feed-card { background: #fff; border-radius: 10px; border: 1px solid #e5e7eb; padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    .meta { display: flex; flex-direction: column; gap: 4px; }
    .date { font-size: 0.8rem; color: #6b7280; }
    .title { font-weight: 600; font-size: 1rem; }
    .cat { font-size: 0.75rem; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; width: fit-content; }
    .amount { font-weight: 700; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="card-account">
    <h3>Checking Account Plus</h3>
    <p>IBAN: <strong>DE99 5005 0222 1234 5678 90</strong></p>
    <p>Verfügbar: 1.840,25 EUR</p>
  </div>

  <div class="feed-card">
    <div class="meta">
      <span class="date">15.10.2026</span>
      <span class="title">Lidl Vertriebs-GmbH &amp; Co. KG</span>
      <span class="cat">Lebensmittel</span>
    </div>
    <div class="amount">-32,45 EUR</div>
  </div>

  <div class="feed-card">
    <div class="meta">
      <span class="date">13.10.2026</span>
      <span class="title">Bäckerei Müller Filiale</span>
      <span class="cat">Bäckerei &amp; Café</span>
    </div>
    <div class="amount">-6,80 EUR</div>
  </div>

  <div class="feed-card">
    <div class="meta">
      <span class="date">01.10.2026</span>
      <span class="title">Global Logistics GmbH</span>
      <span class="cat">Gehaltseingang</span>
    </div>
    <div class="amount">+3.100,00 EUR</div>
  </div>
</body>
</html>
