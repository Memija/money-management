<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" fill="#1E3A8A" />
  <!-- Camera lens with iconic red aperture dot from Thiele branding -->
  <circle cx="24" cy="17" r="10" fill="#2563EB" stroke="#93C5FD" stroke-width="2" />
  <circle cx="24" cy="17" r="4.5" fill="#DA3330" />
  <!-- Flash notch -->
  <rect x="22" y="4" width="4" height="2" rx="1" fill="#93C5FD" />
  <!-- Brand text -->
  <text x="24" y="34.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="6.2" font-weight="900" text-anchor="middle" letter-spacing="0.3">PORTRAITNET</text>
  <text x="24" y="41.5" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="4.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">THIELE FOTO</text>
</svg>