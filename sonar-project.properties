# Project Identification
sonar.projectKey=Memija_money-management
sonar.organization=memija
sonar.projectName=Money Management
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Source & Test Indexing
sonar.sources=src
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,scripts/**/*.test.js,scripts/**/*.spec.js,scripts/**/*.test.mjs,scripts/**/*.spec.mjs
sonar.exclusions=**/node_modules/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**

# Coverage & Duplication (CPD) Exclusions
sonar.coverage.exclusions=src/main.tsx,src/types/**,**/*.d.ts
sonar.cpd.exclusions=src/i18n/**,src/data/**,src/utils/brand-logos/**,src/components/shared/BrandLogo/**

# TypeScript, Analyzer Memory & Test Reports
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-report.xml
