sonar.projectKey=Memija_money-management
sonar.organization=memija
sonar.projectName=Money Management
sonar.host.url=https://sonarcloud.io
sonar.sources=src
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,scripts/**/*.spec.js,scripts/**/*.test.js
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,scripts/**/*.spec.js,scripts/**/*.test.js,src/test/**,dist/**,coverage/**,.lighthouseci/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,scripts/**,src/test/**,dist/**,src/main.tsx
sonar.cpd.exclusions=src/i18n/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/data/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-report.xml
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.sourceEncoding=UTF-8
